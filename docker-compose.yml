services:
  chem-worker:
    build: ./chem-worker
    environment:
      LLM_BASE_URL: https://polza.ai/api/v1
      LLM_MODEL: openai/gpt-5.6-sol
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      LLM_TIMEOUT_S: "600"
      LLM_TEMPERATURE: "0.2"
      LLM_MAX_TOKENS: "8192"
      LLM_MAX_RPM: "30"
    ports:
      - "8000:8000"

  api:
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
      CHEM_WORKER_URL: http://chem-worker:8000
    ports:
      - "8080:8080"
    volumes:
      - api_data:/data
    depends_on:
      - chem-worker

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  redis:
    profiles: ["extras"]
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    profiles: ["extras"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  api_data:
  minio_data:
