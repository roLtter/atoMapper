services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  chem-worker:
    build: ./chem-worker
    environment:
      LLM_BASE_URL: http://host.docker.internal:11434
      LLM_MODEL: neb-fast
      LLM_TIMEOUT_S: "600"
      LLM_TEMPERATURE: "0.2"
      LLM_NUM_CTX: "8192"
      LLM_KEEP_ALIVE: 2m
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
      CHEM_WORKER_URL: http://chem-worker:8000
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_BUCKET: atom-mapper
      MINIO_SECURE: "false"
    ports:
      - "8080:8080"
    volumes:
      - api_data:/data
    depends_on:
      - redis
      - minio
      - chem-worker

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  minio_data:
  api_data:
